set -g status-position bottom
set -g status-interval 2
set -g status-left-length 250
set -g status-left '#(cat /run/pwnagotchi-status 2>/dev/null)'
set -g status-right-length 80
set -g status-right 'PWND #(cat /run/pwnagotchi-shakes 2>/dev/null) #(cat /run/pwnagotchi-last-pwnd 2>/dev/null)  #(cat /run/pwnagotchi-mode 2>/dev/null)'
set -g window-status-format ''
set -g window-status-current-format ''
